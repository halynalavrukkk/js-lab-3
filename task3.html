<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Генератор діалогів</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #fce4ec, #e0f7fa);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #37474f;
        }
        .card {
            background: #ffffff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
            width: 380px;
            border-top: 5px solid #ff80ab;
        }
        h1 {
            font-size: 22px;
            color: #880e4f;
            margin-bottom: 10px;
        }
        p {
            font-size: 14px;
            color: #78909c;
            margin-bottom: 25px;
        }
        .chat-box {
            background: #f8bbd0;
            color: #880e4f;
            padding: 15px;
            border-radius: 12px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Чат-Бот Діалог</h1>
        <p>Виконала: Лаврук Галина</p>
        <div class="chat-box">Розпочніть спілкування з ботом через вікна prompt</div>
    </div>
    <script src="task3.js"></script>
</body>
</html>
