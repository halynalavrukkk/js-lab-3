<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Генератор паролів</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e3f2fd, #fce4ec);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #37474f;
        }
        .card {
            background: #ffffff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
            width: 380px;
            border-top: 5px solid #80d8ff;
        }
        h1 {
            font-size: 22px;
            color: #01579b;
            margin-bottom: 10px;
        }
        p {
            font-size: 14px;
            color: #78909c;
            margin-bottom: 25px;
        }
        .info {
            background: #f1f8e9;
            padding: 15px;
            border-radius: 12px;
            color: #33691e;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Генератор паролів</h1>
        <p>Виконала: Лаврук Галина</p>
        <div class="info">Запустіть сторінку та дотримуйтесь інструкцій у діалогових вікнах!</div>
    </div>
    <script src="task2.js"></script>
</body>
</html>
