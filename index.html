<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Лабораторна робота №3 - Лаврук Галина</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #fce4ec, #e3f2fd);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #37474f;
        }
        .card {
            background: #ffffff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
            width: 400px;
            border-top: 5px solid #ff80ab;
        }
        h1 { font-size: 22px; color: #4a148c; margin-bottom: 5px; }
        p { font-size: 14px; color: #78909c; margin-bottom: 20px; }
        .links { display: flex; flex-direction: column; gap: 10px; }
        a {
            background: linear-gradient(135deg, #ff80ab, #80d8ff);
            color: white;
            padding: 10px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }
        a:hover { opacity: 0.9; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="card">
        <h1>Лабораторна робота №3</h1>
        <p>Виконала: Лаврук Галина</p>

            <a href="task2.html">Завдання 2 (Генератор паролів)</a>

        </div>

</body>
</html>
