<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Контекст this</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e1f5fe, #f8bbd0);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #37474f;
        }
        .card {
            background: #ffffff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
            width: 350px;
            border-top: 5px solid #29b6f6;
        }
        h1 {
            font-size: 22px;
            color: #01579b;
            margin-bottom: 10px;
        }
        p {
            font-size: 14px;
            color: #78909c;
            margin-bottom: 25px;
        }
        button {
            background: linear-gradient(135deg, #29b6f6, #ff80ab);
            border: none;
            color: white;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(41, 182, 246, 0.4);
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 128, 171, 0.6);
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Керування контекстом</h1>
        <p>Виконала: Лаврук Галина</p>
        <button id="hello">Say Hello</button>
    </div>
    <script src="task4.js"></script>
</body>
</html>
